<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>Пользователи</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav><b>Видеоархив</b><a href="/">Главная</a><a href="/records">Записи</a><a href="/users">Пользователи</a><a href="/change-password">Сменить пароль</a>
<form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Выйти</button></form></nav>
<div class="box wide">
<h1>Пользователи</h1>
<p><a class="button" href="/users/new">Добавить пользователя</a></p>
<table>
<thead><tr><th>Логин</th><th>Роль</th><th>2FA</th><th>Статус</th><th>Действия</th></tr></thead>
<tbody>
<tr th:each="u : ${users}">
<td th:text="${u.username}"></td>
<td th:text="${u.role}"></td>
<td th:text="${u.totpEnabled ? 'Включён' : 'Не активирован'}"></td>
<td th:text="${u.enabled ? 'Активен' : 'Заблокирован'}"></td>
<td>
<a class="button" th:href="@{'/users/' + ${u.id} + '/edit'}">Редактировать</a>
<a class="button" th:href="@{'/users/' + ${u.id} + '/2fa-setup'}">2FA</a>
<form class="inline" method="post" th:action="@{'/users/' + ${u.id} + '/toggle'}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<button type="submit" th:text="${u.enabled ? 'Заблокировать' : 'Активировать'}"></button>
</form>
</td>
</tr>
</tbody>
</table>
</div>
</body>
</html>
