<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Смена пароля</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <b>Видеоархив</b>
    <a href="/">Главная</a>
    <a href="/records">Записи</a><a th:if="${isAdmin}" href="/users">Пользователи</a>
    <form method="post" action="/logout">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Выйти</button></form>
</nav>

<div class="box">
    <h1>Смена пароля</h1>

    <form method="post" action="/change-password">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>Текущий пароль</label>
        <input type="password" name="currentPassword" autocomplete="current-password" required>

        <label>Новый пароль</label>
        <input type="password" name="newPassword" minlength="8"
               autocomplete="new-password" required>

        <label>Повторите новый пароль</label>
        <input type="password" name="confirmPassword" minlength="8"
               autocomplete="new-password" required>

        <button>Изменить пароль</button>
    </form>

    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p>Минимальная длина нового пароля — 8 символов.</p>
</div>
</body>
</html>
