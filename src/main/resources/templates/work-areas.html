<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Районы работы</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav><b>Видеоархив</b><a href="/">Главная</a><a href="/records">Записи</a><a href="/users">Пользователи</a><a href="/work-areas">Районы работы</a><a href="/change-password">Сменить пароль</a>
<form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Выйти</button></form></nav>
<div class="box wide">
<h1>Районы работы</h1>
<p class="error" th:if="${error}" th:text="${error}"></p>
<p><a class="button" href="/work-areas/new">Добавить район</a></p>
<table>
<thead><tr><th>Район работы</th><th>Patch</th><th>Действия</th></tr></thead>
<tbody>
<tr th:each="area : ${workAreas}">
<td th:text="${area.name}"></td>
<td th:text="${area.patch}"></td>
<td>
<a class="button" th:href="@{'/work-areas/' + ${area.id} + '/edit'}">Редактировать</a>
<form class="inline" method="post" th:action="@{'/work-areas/' + ${area.id} + '/delete'}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<button class="danger" type="submit" onclick="return confirm('Удалить район?');">Удалить</button>
</form>
</td>
</tr>
</tbody>
</table>
</div>
</body>
</html>
