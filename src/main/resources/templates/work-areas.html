<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Районы работы</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav><b>Відеоархів</b><a href="/">Головна</a><a href="/records">Записи</a><a href="/users">Користувачі</a><a href="/work-areas">Райони відеозйомки</a><a href="/change-password">Змінити пароль</a>
<form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Выйти</button></form></nav>
<div class="box wide">
<h1>Район відеозйомки</h1>
<p class="error" th:if="${error}" th:text="${error}"></p>
<p><a class="button" href="/work-areas/new">Додати район</a></p>
<table>
<thead><tr><th>Район відеозйомки</th><th>patch</th><th>Дія</th></tr></thead>
<tbody>
<tr th:each="wa : ${workAreas}">
<td th:text="${wa.name}"></td>
<td th:text="${wa.patch}"></td>
<td>
<a class="button" th:href="@{'/work-areas/' + ${wa.id} + '/edit'}">Редагувати</a>
<form class="inline" method="post" th:action="@{'/work-areas/' + ${wa.id} + '/delete'}" onsubmit="return confirm('Видалити район?');">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<button class="danger" type="submit">Видалити</button>
</form>
</td>
</tr>
</tbody>
</table>
<p><a href="/users">← До користувачів</a></p>
</div>
</body>
</html>
