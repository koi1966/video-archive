<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Рабочие области</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 1100px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #f2f2f2;
        }

        .patch {
            font-family: Consolas, monospace;
            word-break: break-all;
        }

        .actions {
            white-space: nowrap;
        }

        button,
        a.button {
            display: inline-block;
            padding: 7px 12px;
            border: 1px solid #999;
            border-radius: 4px;
            background: #f5f5f5;
            color: #000;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover,
        a.button:hover {
            background: #e5e5e5;
        }

        .delete {
            margin-left: 5px;
        }

        .top {
            margin-bottom: 20px;
        }

        .empty {
            color: #777;
        }
    </style>
</head>

<body>

<h1>Рабочие области</h1>

<div class="top">
    <a class="button" href="/work-areas/new">
        Добавить рабочую область
    </a>

    <a class="button" href="/users">
        Пользователи
    </a>
</div>

<table>

    <thead>
    <tr>
        <th>Рабочая область</th>
        <th>Patch — путь к видеофайлам</th>
        <th>Действия</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="area : ${workAreas}">

        <td th:text="${area.name}">
            м. Житомир
        </td>

        <td class="patch">

            <span th:if="${area.patch != null and !area.patch.isBlank()}"
                  th:text="${area.patch}">
                D:\VideoArchive\Zhytomyr
            </span>

            <span th:if="${area.patch == null or area.patch.isBlank()}"
                  class="empty">
                Путь не задан
            </span>

        </td>

        <td class="actions">

            <a class="button"
               th:href="@{/work-areas/{id}/edit(id=${area.id})}">
                Изменить
            </a>

            <form th:action="@{/work-areas/{id}/delete(id=${area.id})}"
                  method="post"
                  style="display:inline;"
                  onsubmit="return confirm('Удалить эту рабочую область?');">

                <button type="submit" class="delete">
                    Удалить
                </button>

            </form>

        </td>

    </tr>

    <tr th:if="${#lists.isEmpty(workAreas)}">
        <td colspan="3" class="empty">
            Рабочие области отсутствуют.
        </td>
    </tr>

    </tbody>

</table>

</body>
</html>
