<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="${user.id == null ? 'Новый пользователь' : 'Редактирование пользователя'}">Пользователь</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav><b>Видеоархив</b><a href="/users">Пользователи</a><a href="/records">Записи</a><a href="/change-password">Сменить пароль</a>
<form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Выйти</button></form></nav>
<div class="box">
<h1 th:text="${user.id == null ? 'Добавить пользователя' : 'Редактировать пользователя'}"></h1>
<p class="error" th:if="${error}" th:text="${error}"></p>
<form th:if="${user.id == null}" method="post" action="/users">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Логин</label><input name="username" th:value="${user.username}" required maxlength="50">
<label>Пароль</label><input type="password" name="password" minlength="8" required>
<label>Повторите пароль</label><input type="password" name="confirmPassword" minlength="8" required>
<label>Роль</label><select name="role"><option value="USER" th:selected="${user.role == 'USER'}">USER</option><option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option></select>
<label><input type="checkbox" name="enabled" value="true" th:checked="${user.enabled}"> Активен</label>
<button type="submit">Создать пользователя</button>
</form>
<form th:if="${user.id != null}" method="post" th:action="@{'/users/' + ${user.id} + '/edit'}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<p><b>Логин:</b> <span th:text="${user.username}"></span></p>
<label>Роль</label><select name="role"><option value="USER" th:selected="${user.role == 'USER'}">USER</option><option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option></select>
<label><input type="checkbox" name="enabled" value="true" th:checked="${user.enabled}"> Активен</label>
<button type="submit">Сохранить</button>
</form>
<div th:if="${user.id != null}">
<h2>Сброс пароля</h2>
<form method="post" th:action="@{'/users/' + ${user.id} + '/password'}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Новый пароль</label><input type="password" name="newPassword" minlength="8" required>
<label>Повторите новый пароль</label><input type="password" name="confirmPassword" minlength="8" required>
<button type="submit">Установить новый пароль</button>
</form>
</div>
<p><a href="/users">← К списку пользователей</a></p>
</div>
</body>
</html>
