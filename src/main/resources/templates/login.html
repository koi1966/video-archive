<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Вход</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="box">
<h1>Відеоархів</h1>
<form method="post" action="/login">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Логін</label><input name="username" required>
<label>Пароль</label><input type="password" name="password" required>
<button>Вхід</button>
</form>
<p class="error" th:if="${param.error}">Помилка логін або пароль.</p>
<p th:if="${param.logout}">Ви вийшли з системи.</p>
<p th:if="${param.passwordChanged}">Пароль успішно змінений. Входите з новым паролем.</p>
</div>
</body>
</html>
