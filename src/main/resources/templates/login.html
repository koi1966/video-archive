<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Вход</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="box">
<h1>Видеоархив</h1>
<form method="post" action="/login">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Логин</label><input name="username" required>
<label>Пароль</label><input type="password" name="password" required>
<button>Войти</button>
</form>
<p class="error" th:if="${param.error}">Неверный логин или пароль.</p>
<p th:if="${param.logout}">Вы вышли из системы.</p>
<p th:if="${param.passwordChanged}">Пароль успешно изменён. Войдите с новым паролем.</p>
</div>
</body>
</html>
