<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="${record.id == null ? 'Новая запись' : 'Редактирование записи'}"></title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav>
    <b>Видеоархив</b>
    <a href="/records">Назад</a>
    <a href="/change-password">Сменить пароль</a>
</nav>
<div class="box wide">
<h1 th:text="${record.id == null ? 'Новая запись' : 'Редактирование записи'}"></h1>

<form th:if="${record.id == null}" method="post" action="/records">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Кто дал файлы</label><input name="fileProvider" th:value="${record.fileProvider}" required>
    <label>Дата</label><input type="date" name="recordDate" th:value="${record.recordDate}" required>
    <label>Название фирмы</label><input name="companyName" th:value="${record.companyName}" required>
    <label>Название</label><input name="title" th:value="${record.title}" required>
    <label>Описание</label><textarea name="description" rows="5" th:text="${record.description}"></textarea>
    <button>Сохранить запись</button>
</form>

<form th:unless="${record.id == null}" method="post"
      th:action="@{'/records/' + ${record.id} + '/edit'}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Кто дал файлы</label><input name="fileProvider" th:value="${record.fileProvider}" required>
    <label>Дата</label><input type="date" name="recordDate" th:value="${record.recordDate}" required>
    <label>Название фирмы</label><input name="companyName" th:value="${record.companyName}" required>
    <label>Название</label><input name="title" th:value="${record.title}" required>
    <label>Описание</label><textarea name="description" rows="5" th:text="${record.description}"></textarea>
    <button>Сохранить изменения</button>
</form>

<p th:if="${record.id != null}">
    Видео уже прикреплённые к записи не изменяются. Управление видео выполняется
    на странице записи.
</p>
</div>
</body>
</html>
