<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="${record.id == null ? 'Новая запись' : 'Редактирование записи'}"></title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav>
    <b>Відеоархів</b>
    <a href="/records">Повернутись</a>
    <a href="/change-password">Зміна паролю</a>
</nav>
<div class="box wide">
<h1 th:text="${record.id == null ? 'Новий запис' : 'Редагування запису'}"></h1>

<form th:if="${record.id == null}" method="post" action="/records">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Хто надав файли</label><input name="fileProvider" th:value="${record.fileProvider}" required>
    <label>Дата</label><input type="date" name="recordDate" th:value="${record.recordDate}" required>
    <label>Назва фірми</label><input name="companyName" th:value="${record.companyName}" required>
    <label>Назва</label><input name="title" th:value="${record.title}" required>
    <label>Опис</label><textarea name="description" rows="5" th:text="${record.description}"></textarea>
    <button>Зберегти запис</button>
</form>

<form th:unless="${record.id == null}" method="post"
      th:action="@{'/records/' + ${record.id} + '/edit'}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Хто надав файли</label><input name="fileProvider" th:value="${record.fileProvider}" required>
    <label>Дата</label><input type="date" name="recordDate" th:value="${record.recordDate}" required>
    <label>Назва фірми</label><input name="companyName" th:value="${record.companyName}" required>
    <label>Назва</label><input name="title" th:value="${record.title}" required>
    <label>Опис</label><textarea name="description" rows="5" th:text="${record.description}"></textarea>
    <button>Зберегти змін</button>
</form>

<p th:if="${record.id != null}">
    Відео вже прикріплені до запису не змінюються. Управління відео виконується
    на сторінці запису.
</p>
</div>
</body>
</html>
