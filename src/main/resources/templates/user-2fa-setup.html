<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Налаштування 2FA</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav><b>Відеоархів</b><a href="/users">Користувачі</a><a href="/records">Записи</a><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Вихід</button></form></nav>
<div class="box">
<h1>Google Authenticator</h1>
<p>Користувач: <b th:text="${user.username}"></b></p>
<p>Отскануйте QR-код в Google Authenticator.</p>
<img class="qr" th:src="'data:image/png;base64,' + ${qr}" alt="QR-код">
<p>Якщо сканування неможливе, введіть цей секрет вручну:</p>
<code th:text="${secret}"></code>
<p>Після цього користувач має ввести поточний 6-значний код. Після успішної перевірки 2FA буде активовано.</p>
<form method="post" th:action="@{'/users/' + ${user.id} + '/reset-2fa'}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<button type="submit" class="danger" onclick="return confirm('Створити новий секрет Google Authenticator? Старий код перестане працювати.');">Скинути та створити новий QR</button>
</form>
<p><a href="/users">← До списку користувачів</a></p>
</div>
</body>
</html>
