spring.application.name=video-archive
server.port=8080

spring.data.mongodb.uri=mongodb://localhost:27017/video_archive

spring.servlet.multipart.max-file-size=20GB
spring.servlet.multipart.max-request-size=20GB

spring.thymeleaf.cache=false

# Change this to a directory on the separate video HDD.
video.storage.path=D:\VideoArchive

# Initial admin account. Change the password in production.
app.admin.reset-password=false
app.admin.username=admin
app.admin.password=admin123
app.admin.issuer=VideoArchive
